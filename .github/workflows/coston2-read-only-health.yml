name: Coston2 Read-only Health

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coston2-read-only-health
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public Coston2 release health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public Coston2 release
        run: pnpm judge:verify:live --output "$RUNNER_TEMP/flarequorum-live-verification.json"

      - name: Upload sanitized public report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flarequorum-live-verification
          path: ${{ runner.temp }}/flarequorum-live-verification.json
          if-no-files-found: error
          retention-days: 14
