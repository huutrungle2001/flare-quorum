name: Release CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm compile

      - name: Run workspace tests
        run: pnpm test

      - name: Run typed lint
        run: pnpm lint

      - name: Build release packages
        run: pnpm build

      - name: Check generated bindings
        run: pnpm bindings:check

      - name: Check release documentation
        run: pnpm docs:check

      - name: Scan current source and Git history
        run: pnpm secret:scan

      - name: Validate sanitized evidence
        run: pnpm evidence:validate
