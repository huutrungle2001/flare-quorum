name: Release CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.8
          cache-dependency-path: apps/fcc-extension/go.sum

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm compile

      - name: Install pinned Slither
        run: python3 -m pip install --disable-pip-version-check slither-analyzer==0.11.6

      - name: Verify declared release toolchain
        run: pnpm env:doctor

      - name: Run V2 market static analysis
        run: pnpm flare:slither:v2

      - name: Run workspace tests
        run: pnpm test

      - name: Run critical coverage gates
        run: |
          pnpm --filter @flarequorum/settlement-relay test:coverage
          pnpm --filter @flarequorum/tender-room test:coverage

      - name: Run typed lint
        run: pnpm lint

      - name: Build release packages
        run: pnpm build

      - name: Check generated bindings
        run: pnpm bindings:check

      - name: Check release documentation
        run: pnpm docs:check

      - name: Scan current source and Git history
        run: pnpm secret:scan

      - name: Validate sanitized evidence
        run: pnpm evidence:validate
